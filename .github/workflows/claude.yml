name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: '--append-system-prompt "Before doing anything, read and follow .github/claude/change-requests.md" --allowedTools "Bash(npm ci:*),Bash(npm run:*)"'
          branch_prefix: 'change/'
          branch_name_template: '{{prefix}}{{entityNumber}}-{{description}}'

      - name: Open PR
        if: success() && github.event_name == 'issue_comment' && !github.event.issue.pull_request && steps.claude.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          AHEAD=$(gh api "repos/$REPO/compare/main...$BRANCH" --jq .ahead_by 2>/dev/null || echo 0)
          if [ "$AHEAD" = "0" ]; then echo "No changes, skipping"; exit 0; fi
          if [ -n "$(gh pr list --repo "$REPO" --head "$BRANCH" --json number --jq '.[0].number')" ]; then echo "PR already exists"; exit 0; fi
          gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$TITLE" --body "From #$ISSUE. Closes #$ISSUE"
